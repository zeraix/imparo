[package]
name = "imparo-model"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
serde_json = "1"
imparo-kv = { path = "../imparo-kv" }
sha2 = "0.11"
imparo-gguf = { path = "../imparo-gguf" }
imparo-cpu = { path = "../imparo-cpu" }
imparo-backend = { path = "../imparo-backend" }
imparo-host = { path = "../imparo-host" }
imparo-cuda = { path = "../imparo-cuda", optional = true }
libc = "0.2.177"


[target.'cfg(target_os = "macos")'.dependencies]
imparo-metal = { path = "../imparo-metal" }

[features]
cuda = ["dep:imparo-cuda", "imparo-cuda/cuda"]
[[bin]]
name = "imparo-plan"
path = "src/bin/imparo-plan.rs"
[[bin]]
name = "imparo-forward"
path = "src/bin/imparo-forward.rs"

[[bin]]
name = "imparo-metalbench"
path = "src/bin/imparo-metalbench.rs"


# unsafe is allowed here for exactly one thing: the read-only file mapping in ggufscan
# (mmap/munmap and the slice view over it), which lets the tokenizer borrow its token
[lints]
workspace = true
