[package]
autobins = false
name = "imparo-model"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
serde_json = "1"
imparo-kv = { path = "../imparo-kv" }
sha2 = "0.11"
imparo-gguf = { path = "../imparo-gguf" }
imparo-cpu = { path = "../imparo-cpu" }
imparo-backend = { path = "../imparo-backend" }
imparo-host = { path = "../imparo-host" }
imparo-cuda = { path = "../imparo-cuda", optional = true }
libc = "0.2.177"


[target.'cfg(target_os = "macos")'.dependencies]
imparo-metal = { path = "../imparo-metal" }

[features]
# Speculation is part of the engine, not an experiment: the server serves a draft pairing
# out of the box and a build without it refuses one at startup. `--no-default-features`
# still compiles the engine without any speculation code.
default = ["speculative"]
cuda = ["dep:imparo-cuda", "imparo-cuda/cuda"]
cuda-dynamic = ["dep:imparo-cuda", "imparo-cuda/cuda-dynamic"]
# CUDA-only laboratory capture surface. This is deliberately not a default feature:
# every capture inserts synchronization/readback boundaries and is inadmissible timing
# evidence by construction.
cuda-gate0-capture = ["cuda"]
# Speculation that names no backend: pairing files, draft specs, observed prefill.
speculative = []
cuda-speculative = ["cuda", "speculative", "imparo-cuda/cuda-speculative"]
cuda-owner-lab = ["cuda-speculative", "imparo-cuda/cuda-owner-lab"]
[[bin]]
name = "imparo-plan"
path = "src/bin/imparo-plan.rs"
[[bin]]
name = "imparo-forward"
path = "src/bin/imparo-forward.rs"

[[bin]]
name = "imparo-metalbench"
path = "src/bin/imparo-metalbench.rs"


# unsafe is allowed here for exactly one thing: the read-only file mapping in ggufscan
# (mmap/munmap and the slice view over it), which lets the tokenizer borrow its token
[lints]
workspace = true
